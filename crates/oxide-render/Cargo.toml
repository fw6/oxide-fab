[package]
name = "oxide-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The wgpu renderer of oxide-fab: GLB meshes, an orbit camera, picking-aligned draws and a headless frame export."

[dependencies]
oxide-scene = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
pollster = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wgpu = "29"

[lints]
workspace = true
