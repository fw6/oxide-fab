[package]
name = "oxide-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

# The nsh app is its own workspace; nsh builds its runners from this crate.
[workspace]

# Same artifact-size policy as the root workspace: the nsh crates are
# dependencies of this workspace, and their DWARF was ~10 GB of
# target/debug/deps on a full build (88% of the nsh_base objects).
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxide-core = { path = "../../crates/oxide-core" }
oxide-sim = { path = "../../crates/oxide-sim" }
oxide-scene = { path = "../../crates/oxide-scene" }
oxide-render = { path = "../../crates/oxide-render" }
glam = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.5.0", default-features = false, features = ["plot", "math"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.5.0", default-features = false, features = ["plot", "math"] }
# Feature unification: nsh's macOS backend does not build NSImageView, which
# the viewport image needs. Same version and source as the platform crate.
objc2-app-kit = { version = "0.3.2", features = ["NSImageView"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.5.0", default-features = false, features = ["plot", "math"] }

[dev-dependencies]
nsh-engine = "0.6.0"
nsh-testing = "0.5.0"

[lints]
workspace = true

# The same policy as the server workspace. This is a one-package workspace, so
# the table lives here rather than being inherited from the root manifest.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Deliberate layout arithmetic: the dashboard converts px, slots and counts in
# one place, and every conversion is reviewed where it happens.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Folded state is written from string literals; `clone_into` reads worse than
# an assignment for a `&str` source and saves nothing worth having.
assigning_clones = "allow"
# Colours are written as `0xRRGGBB`; digit separators would obscure them.
unreadable_literal = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cargo_common_metadata = "allow"
# The nsh platform crates pull their own dependency versions; that graph is
# not ours to resolve.
multiple_crate_versions = "allow"

