[package]
name = "oxide-ui"
version = "0.1.2"
edition = "2024"
publish = false

# The nsh app is its own workspace; nsh builds its runners from this crate.
[workspace]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, features = ["plot", "math"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, features = ["plot", "math"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, features = ["plot", "math"] }

[dev-dependencies]
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"
