\* Isolate the failed-append path: snapshots only between batches, so the
\* only way `mem` gets ahead of the log is a failed `append_events` that does
\* not roll back the aggregate's in-memory transition.
CONSTANTS
  MaxEvents = 3
  AtomicCommit = FALSE
  SnapshotAtomic = FALSE
  SnapshotQuiet = TRUE
  FailAllowed = TRUE
  RestartAllowed = TRUE

INIT Init
NEXT Next
INVARIANTS TypeOK RecoveryMatches
CHECK_DEADLOCK FALSE
