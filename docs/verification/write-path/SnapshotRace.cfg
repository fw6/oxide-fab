\* Isolate the capture/read gap: snapshots only between batches, so the only
\* way to break recovery is a commit that lands between `sim.snapshot()` and
\* `max_seq()`.
CONSTANTS
  MaxEvents = 3
  AtomicCommit = FALSE
  SnapshotAtomic = FALSE
  SnapshotQuiet = TRUE
  FailAllowed = FALSE
  RestartAllowed = TRUE

INIT Init
NEXT Next
INVARIANTS TypeOK RecoveryMatches
CHECK_DEADLOCK FALSE
