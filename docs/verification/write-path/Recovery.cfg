\* Isolate the snapshot/restart finding. The log can also be reordered here,
\* so this checks the recovery promise on every log the write path can make.
CONSTANTS
  MaxEvents = 3
  AtomicCommit = FALSE
  SnapshotAtomic = FALSE
  SnapshotQuiet = FALSE
  FailAllowed = TRUE
  RestartAllowed = TRUE

INIT Init
NEXT Next
INVARIANTS TypeOK RecoveryMatches
CHECK_DEADLOCK FALSE
