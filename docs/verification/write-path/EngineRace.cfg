\* The engine/operator variant of the write-order finding: a hold commits
\* before the track-in it raced with, so the restart resurrects the lot.
CONSTANTS
  MaxEvents = 3
  AtomicCommit = FALSE
  SnapshotAtomic = FALSE
  SnapshotQuiet = FALSE
  FailAllowed = FALSE
  RestartAllowed = FALSE

INIT Init
NEXT Next
INVARIANTS TypeOK NoTrackInAfterHold
CHECK_DEADLOCK FALSE
