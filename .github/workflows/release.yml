name: Release

# A tag publishes only what CI has already verified: the workflow calls ci.yml
# first, then builds the three platforms, the nsh packages, the checksums and
# the container image.
#
# It can also be run by hand in dry-run mode, which builds and checksums every
# artifact (three binaries, the nsh packages) and builds the image without
# pushing it or creating a GitHub release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (default: 0.0.0-dryrun-<run>)"
        required: false
        default: ""
      dry_run:
        description: "Build everything, skip the GHCR push and the GitHub release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  binaries:
    name: oxide-server ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin oxide

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="oxide-server-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/oxide "dist/${name}/oxide"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "oxide-server-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/oxide.exe "dist/$name/oxide.exe"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: oxide-server-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  nsh-packages:
    name: nsh packages (web, tui)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          # The web package compiles the runtime for wasm.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/oxide-ui

      - name: Native libraries (GTK 4, GStreamer, Pango) and the wasm C toolchain
        # The web runtime compiles zstd for wasm32; cc-rs looks for llvm-ar.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpango1.0-dev clang llvm lld
          if ! command -v llvm-ar >/dev/null; then
            LLVM_AR="$(find /usr/lib -maxdepth 3 -path '*/llvm-*/bin/llvm-ar' | sort -V | tail -1)"
            sudo ln -sf "$LLVM_AR" /usr/local/bin/llvm-ar
          fi
          echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar)" >> "$GITHUB_ENV"
          llvm-ar --version | head -1

      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          NSH_VERSION: v0.5.1

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the web package
        run: |
          set -euo pipefail
          nsh package crates/oxide-ui --target web \
            --name "oxide-ui" --app-version "$VERSION" --build "$GITHUB_RUN_NUMBER" \
            -o dist/web
          tar -C dist/web -czf "dist/oxide-ui-${VERSION}-web.tar.gz" .

      - name: Build the TUI package
        # nsh 0.5.0, 0.5.1 and the nightly all reject `--target tui` for
        # `package` (the value is a built-in run/test target, so the external
        # target mechanism is not reached). The TUI is therefore shipped as the
        # app description plus the sources the terminal host mounts, and the
        # TUI target itself is exercised by `nsh test --target tui` below.
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nsh test crates/oxide-ui --target tui --junit artifacts/nsh-tui-tests.xml
          nsh build crates/oxide-ui --release -o "dist/tui"
          mkdir -p dist/tui/app/src dist/tui/app/tests
          cp crates/oxide-ui/{Cargo.toml,Cargo.lock,nsh.json,theme.json,App.test.tsx} dist/tui/app/
          cp crates/oxide-ui/src/*.rs dist/tui/app/src/
          cp crates/oxide-ui/tests/*.rs dist/tui/app/tests/
          cp README.md "dist/tui/README.md"
          cat > "dist/tui/RUNNING.txt" <<'TXT'
          oxide-ui — the terminal dashboard.

          nsh 0.5.x has no `nsh package --target tui`, and `nsh build` bundles
          nothing: it writes only `app.json` (the app identity). This archive
          therefore carries that file plus the whole crate the terminal host
          mounts, which is what `nsh run --target tui` needs. With nsh
          installed and the GTK/GStreamer libraries present:

            cd app
            nsh run --target tui

          The crate is self-contained (its Cargo.toml declares its own
          workspace), so it builds from this directory.

          CI builds the terminal host and runs the UI in an in-memory terminal
          (`nsh test crates/oxide-ui --target tui`); see the release notes for
          the limits of this packaging.
          TXT
          tar -C dist -czf "dist/oxide-ui-${VERSION}-tui.tar.gz" tui

      - uses: actions/upload-artifact@v4
        with:
          name: oxide-ui-packages
          path: |
            dist/oxide-ui-*-web.tar.gz
            dist/oxide-ui-*-tui.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nsh-tui-tests
          path: artifacts/nsh-tui-tests.xml
          if-no-files-found: warn

  checksums:
    name: SHA256SUMS
    needs: [binaries, nsh-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute the checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -ge 5

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  image:
    name: container image
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the Dockerfile builds
        run: docker build -f Dockerfile -t "oxide-fab:${VERSION}" .

      - name: Build and push
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          docker tag "oxide-fab:${VERSION}" "ghcr.io/fw6/oxide-fab:${VERSION}"
          docker tag "oxide-fab:${VERSION}" "ghcr.io/fw6/oxide-fab:latest"
          docker push "ghcr.io/fw6/oxide-fab:${VERSION}"
          docker push "ghcr.io/fw6/oxide-fab:latest"

  release:
    name: publish
    needs: [checksums, image]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download the CI evidence (chaos report)
        uses: actions/download-artifact@v4
        with:
          name: oxide-evidence
          path: artifacts

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          set -euo pipefail
          cat > NOTES.md <<EOF
          oxide-fab ${VERSION} — 氧化层

          运行整个演示：

              cp .env.example .env
              docker compose up -d --wait
              ./scripts/smoke.sh

          校验下载的文件：

              sha256sum -c SHA256SUMS.txt        # macOS: shasum -a 256 -c

          镜像：\`ghcr.io/fw6/oxide-fab:${VERSION}\` 与 \`:latest\`。

          已知限制（请如实阅读）：

          - 单机演示；「防宕机」是断链缓冲 + 重启重放，不是自动 failover。
          - 机台与 SECS/GEM 对端是仿真的（simulated tool only），未接真实机台，
            未通过任何 SEMI 认证。
          - 开源版 GreptimeDB standalone：没有读副本、没有双活。
          - **桌面目标（macOS / Windows / Linux 桌面）不产出 nsh 包**：nsh 包
            只由 ubuntu job 产出，共两件（web 与 tui）；桌面交付物是
            \`oxide-server-<version>-<target>\` 二进制包。
          - nsh 0.5.x 的 \`nsh package\` 没有 \`tui\` 目标：TUI 产物是
            \`nsh build\` 的应用包 + 应用源码，用已安装的 nsh 运行
            （\`cd app && nsh run --target tui\`）。

          ## 变更记录（CHANGELOG 片段）

          EOF
          {
            awk 'BEGIN{p=0} /^## \[/{p++} p==1{print} p==2{exit}' CHANGELOG.md
            echo ""
            echo "完整记录见仓库的 CHANGELOG.md。"
          } >> NOTES.md
          cat NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: |
            dist/oxide-server-*.tar.gz
            dist/oxide-server-*.zip
            dist/oxide-ui-*-web.tar.gz
            dist/oxide-ui-*-tui.tar.gz
            dist/SHA256SUMS.txt
            artifacts/chaos-report.md
          fail_on_unmatched_files: false
