name: Release

# A tag publishes only what CI has already verified: the workflow calls ci.yml
# first, then builds the three platforms, the nsh packages, the checksums and
# the container image.
#
# It can also be run by hand in dry-run mode, which builds and checksums every
# artifact (three binaries, the nsh packages) and builds the image without
# pushing it or creating a GitHub release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (default: 0.0.0-dryrun-<run>)"
        required: false
        default: ""
      dry_run:
        description: "Build everything, skip the GHCR push and the GitHub release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NSH_VERSION: v0.6.1

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    # The gate only has to verify; its evidence artefacts would collide with the
    # release's own desktop-* packages in the same run.
    with:
      artifacts: false

  binaries:
    name: oxide-server ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@v2

      - name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin oxide

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="oxide-server-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/oxide "dist/${name}/oxide"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "oxide-server-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/oxide.exe "dist/$name/oxide.exe"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: oxide-server-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  desktop-packages:
    name: desktop ${{ matrix.target }} package
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
          - os: macos-latest
            target: macos
            arch: arm64
          - os: windows-latest
            target: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      # Restored before the Rust target; see the note in ci.yml. Without it every
      # release cut rebuilds the nsh runner workspace from nothing.
      - name: Cache the nsh runner workspace
        uses: actions/cache@v4
        with:
          path: crates/oxide-ui/.nsh
          key: nsh-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('crates/oxide-ui/nsh.json', 'crates/oxide-ui/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys on the job id by default, and this job is
          # `desktop-packages` while ci.yml's is `desktop`. Naming the CI job's
          # key makes a release reuse what CI already built; without it every
          # release cut was a cold build (9-14 minutes per desktop).
          shared-key: desktop
          workspaces: |
            .
            crates/oxide-ui


            # `/var/cache/apt/archives` is root-owned, so an `actions/cache` of that
      # path never saved (tar failed on `partial`/`lock`). Point apt at a
      # runner-owned cache instead: the ~300 MB of .debs is what a slow mirror
      # makes expensive, and the same install has taken 0.4 and 21 minutes.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-gtk-vulkan-1

      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=5 update
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=5 install -y --no-install-recommends \
            libgtk-4-dev libjavascriptcoregtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpango1.0-dev libvulkan1 mesa-vulkan-drivers xvfb imagemagick

      - name: Install nsh (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build, run and archive the desktop package
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./scripts/desktop-package.sh dist
          mkdir -p artifacts
          case "${{ matrix.target }}" in
            macos)
              ditto -c -k --keepParent "dist/macos/oxide-fab.app" \
                "dist/oxide-fab-${VERSION}-macos-$(uname -m).zip"
              ;;
            linux)
              tar -C dist/linux -czf \
                "dist/oxide-fab-${VERSION}-linux-$(uname -m).tar.gz" oxide-fab
              ;;
            windows)
              # The bash step runs with `set -u`, so `$env:VERSION` inside a
              # double-quoted PowerShell command is an unbound bash variable.
              # This step exports VERSION, so bash can interpolate it directly.
              powershell -NoProfile -Command "Compress-Archive -Path 'dist/windows/oxide-fab' -DestinationPath 'dist/oxide-fab-${VERSION}-windows-${{ matrix.arch }}.zip'"
              setup="$(find dist/windows -maxdepth 1 -name '*-setup.exe' | head -1 || true)"
              if [ -n "$setup" ]; then
                cp "$setup" "dist/oxide-fab-${VERSION}-windows-${{ matrix.arch }}-setup.exe"
              else
                echo "::warning::Inno Setup 6 not found; shipping the zip only"
              fi
              ;;
          esac
          ls -la dist

      - name: Screenshot the packaged app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The inner script is single-quoted on purpose: $! and $pid belong to it.
          # shellcheck disable=SC2016
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            set -euo pipefail
            OXIDE_DEMO=1 dist/linux/oxide-fab/oxidefab &
            pid=$!
            sleep 20
            import -window root artifacts/desktop-linux.png
            kill $pid || true'
          test -s artifacts/desktop-linux.png

      - name: Screenshot the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          OXIDE_DEMO=1 "dist/macos/oxide-fab.app/Contents/MacOS/oxidefab" &
          pid=$!
          sleep 20
          swift scripts/window-shot.swift oxide-fab artifacts/desktop-macos.png
          kill $pid || true
          test -s artifacts/desktop-macos.png

      - name: Screenshot the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OXIDE_DEMO = "1"
          # nsh names the Windows binary after --name (oxide-fab.exe); on macOS
          # and Linux it is oxidefab.
          $exe = Get-Item "dist\windows\oxide-fab\oxide-fab.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "no oxide-fab.exe in the Windows package" }
          $app = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "the packaged app exited with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class OxideWin {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr hWnd, int x, int y, int width, int height, bool repaint);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hWnd, int attribute, out RECT rect, int size);
          }
          "@
          $proc = Get-Process oxide-fab | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          if (-not $proc) { throw "the packaged app has no window" }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $width = if ($screen.Width -ge 1500 -and $screen.Height -ge 940) { 1500 } else { 1120 }
          $height = if ($width -eq 1500) { 940 } else { 720 }
          [OxideWin]::MoveWindow($proc.MainWindowHandle, 0, 0, $width, $height, $true) | Out-Null
          [OxideWin]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 3
          $rect = New-Object OxideWin+RECT
          # The DWM frame bounds exclude the invisible resize border, which
          # CopyFromScreen would otherwise capture as a blank margin.
          if ([OxideWin]::DwmGetWindowAttribute($proc.MainWindowHandle, 9, [ref]$rect, 16) -ne 0) {
            [OxideWin]::GetWindowRect($proc.MainWindowHandle, [ref]$rect) | Out-Null
          }
          Write-Host "desktop $($screen.Width)x$($screen.Height); capturing $(($rect.Right - $rect.Left))x$(($rect.Bottom - $rect.Top))"
          $bitmap = New-Object System.Drawing.Bitmap(($rect.Right - $rect.Left), ($rect.Bottom - $rect.Top))
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
          $bitmap.Save("artifacts\desktop-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $app.Id -Force

      # Upload one path, so the files land at the artifact root instead of under
      # dist/ and artifacts/, which is what the checksums and publish jobs expect
      # once merge-multiple flattens the downloads.
      - name: Stage the release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          mv dist/oxide-fab-* dist/release/
          cp "artifacts/desktop-${{ matrix.target }}.png" dist/release/

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [binaries, desktop-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute the checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          # The desktop artifacts keep their upload paths (`dist/…`), so the
          # packages arrive one level down; take every file and hash basenames.
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | sed 's#  \./[^ ]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -ge 5

      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  image:
    name: container image
    needs: checksums
    runs-on: ubuntu-latest
    # The arm64 leg compiles the workspace under QEMU; the amd64 leg is native.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the Dockerfile builds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: docker buildx build --platform linux/amd64 --load -t "oxide-fab:${VERSION}" .

      # Both architectures, because the Dockerfile selects its musl target from
      # TARGETARCH and a single-platform push would make `docker pull` fail on
      # Apple Silicon (observed on 0.1.0: "no matching manifest for
      # linux/arm64/v8").
      - name: Build and push (linux/amd64, linux/arm64)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/fw6/oxide-fab:${VERSION}" \
            --tag "ghcr.io/fw6/oxide-fab:latest" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --push .

  release:
    name: publish
    needs: [checksums, image]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Download the CI evidence (chaos report)
        uses: actions/download-artifact@v8
        with:
          name: oxide-evidence
          path: artifacts

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              version="0.0.0-dryrun-${GITHUB_RUN_NUMBER}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          set -euo pipefail
          cat > NOTES.md <<EOF
          oxide-fab ${VERSION} — 氧化层

          运行整个演示：

              cp .env.example .env
              docker compose up -d --wait
              ./scripts/smoke.sh

          校验下载的文件：

              sha256sum -c SHA256SUMS.txt        # macOS: shasum -a 256 -c

          镜像：\`ghcr.io/fw6/oxide-fab:${VERSION}\` 与 \`:latest\`（linux/amd64 + linux/arm64）。

          已知限制（请如实阅读）：

          - 单机演示；「防宕机」是断链缓冲 + 重启重放，不是自动 failover。
          - 机台与 SECS/GEM 对端是仿真的（simulated tool only），未接真实机台，
            未通过任何 SEMI 认证。
          - 开源版 GreptimeDB standalone：没有读副本、没有双活。
          - 桌面安装包**未签名**：macOS 没有 Developer ID 与公证，Windows 没有
            Authenticode；首次打开需按系统提示放行。
          - 桌面应用需要后端：先在仓库根目录 \`docker compose up -d --wait\`。离线
            打开只有场景骨架与空面板，不伪造数据。

          桌面交付物（三件，均由各自的 runner 打包、启动并截图）：

          - macOS：\`oxide-fab-<version>-macos-arm64.zip\`（内含 \`oxide-fab.app\`）
          - Linux：\`oxide-fab-<version>-linux-x86_64.tar.gz\`（目录包，可执行文件
            为 \`oxide-fab/oxidefab\`）
          - Windows：\`oxide-fab-<version>-windows-x86_64.zip\` 与
            \`-setup.exe\`（Inno Setup 安装包；可执行文件为 \`oxide-fab.exe\`）

          服务端二进制：\`oxide-server-<version>-<target>\`。

          ## 变更记录（CHANGELOG 片段）

          EOF
          {
            awk 'BEGIN{p=0} /^## \[/{p++} p==1{print} p==2{exit}' CHANGELOG.md
            echo ""
            echo "完整记录见仓库的 CHANGELOG.md。"
          } >> NOTES.md
          cat NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          body_path: NOTES.md
          files: |
            dist/oxide-server-*.tar.gz
            dist/oxide-server-*.zip
            dist/oxide-fab-*.zip
            dist/oxide-fab-*.tar.gz
            dist/oxide-fab-*.exe
            dist/SHA256SUMS.txt
            artifacts/chaos-report.md
          fail_on_unmatched_files: false
