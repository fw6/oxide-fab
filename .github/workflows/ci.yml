name: CI

# Runs on every push and pull request, and is reused by release.yml so a tag
# cannot publish anything that this workflow has not verified.
#
# Phase 2 changed the UI deliverable: the workbench is a desktop application
# (macOS, Windows, Linux), the 3D viewport is wgpu, and every target is built,
# packaged and run on its own runner. The web and TUI packages are gone.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this as its gate. It passes `artifacts: false` because the
  # gate's artefacts would share names with the release's own packages in the
  # same run, and the checksums job cannot tell them apart.
  workflow_call:
    inputs:
      artifacts:
        description: "Upload the job artefacts (evidence, reports)"
        type: boolean
        default: true

permissions:
  contents: read

# A push that supersedes a pull request run cancels it: the matrix costs minutes
# per OS and the older commit is already stale. Pushes to main are left alone so
# every merged commit keeps its verification, and release.yml passes its own ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NSH_VERSION: v0.6.1

jobs:
  lint-and-test:
    name: fmt, clippy, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: A software Vulkan device for the renderer tests
        # oxide-render's tests draw real frames. On a runner that means a
        # software adapter (lavapipe), which is the same path CI uses for the
        # packaged app's evidence.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-tools
          for icd in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                     /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$icd" ]; then
              echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
              break
            fi
          done
          vulkaninfo --summary | head -20 || true

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (no database needed; the renderer uses lavapipe)
        env:
          OXIDE_RENDER_SOFTWARE: "1"
        run: cargo test --workspace

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  ui:
    name: nsh TSX UI tests, assets and UI workspace lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Restored before the Rust target so the cached artefacts keep their newer
      # mtimes; see the desktop job.
      - name: Cache the nsh runner workspace
        uses: actions/cache@v4
        with:
          path: crates/oxide-ui/.nsh
          key: nsh-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('crates/oxide-ui/nsh.json', 'crates/oxide-ui/Cargo.lock') }}

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@v2
        with:
          # The job lints and tests the UI workspace, but validate-assets.sh runs
          # oxide-render from the root workspace; both targets are cached so the
          # second one is not a cold build.
          workspaces: |
            . -> target
            crates/oxide-ui -> target


            # `/var/cache/apt/archives` is root-owned, so an `actions/cache` of that
      # path never saved (tar failed on `partial`/`lock`). Point apt at a
      # runner-owned cache instead: the ~300 MB of .debs is what a slow mirror
      # makes expensive, and the same install has taken 0.4 and 21 minutes.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-gtk-vulkan-1

      - name: Native libraries for the desktop targets
        run: |
          set -euo pipefail
          # A stalled mirror read once parked this step for half an hour: fail
          # or retry instead of waiting on a dead connection.
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=5 update
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=5 install -y --no-install-recommends \
            libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpango1.0-dev libvulkan1 mesa-vulkan-drivers xvfb imagemagick \
            fonts-noto-cjk

      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: nsh version
        run: nsh --version

      # The UI is its own Cargo workspace, so the root job's clippy gate does
      # not see it. Same policy, same flags.
      - name: cargo fmt and clippy (the UI's own workspace)
        run: |
          cargo fmt --manifest-path crates/oxide-ui/Cargo.toml --all -- --check
          cargo clippy --manifest-path crates/oxide-ui/Cargo.toml \
            --all-targets -- -D warnings

      - name: nsh check (cargo check and the TSX type check)
        run: nsh check crates/oxide-ui

      - name: "nsh test (headless TSX: shell, domains, control bar, demo; JUnit report)"
        run: |
          mkdir -p artifacts
          nsh test crates/oxide-ui --junit artifacts/nsh-tests.xml

      - name: GLB and manifest validation
        run: ./scripts/validate-assets.sh | tee artifacts/assets-validation.log

      - name: Upload the nsh test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nsh-tests
          path: |
            artifacts/nsh-tests.xml
            artifacts/assets-validation.log
          if-no-files-found: warn

  desktop:
    name: desktop ${{ matrix.target }} (package, run, screenshot)
    # Only the lint gate: these jobs build the UI themselves, so waiting for the
    # UI lint job would put two independent matrices end to end.
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
          - os: macos-latest
            target: macos
            arch: arm64
          - os: windows-latest
            target: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      # nsh regenerates crates/oxide-ui/.nsh on checkout, and a fresh runner
      # workspace rebuilds for minutes (11 min on this machine; 5 s when the
      # workspace is already there). It is restored *before* the Rust target so
      # the cached artefacts keep their newer mtimes - restored the other way
      # round, cargo treats every source as changed and rebuilds anyway.
      # nsh.json, the UI lockfile and the nsh release pin what it may contain.
      - name: Cache the nsh runner workspace
        uses: actions/cache@v4
        with:
          path: crates/oxide-ui/.nsh
          key: nsh-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('crates/oxide-ui/nsh.json', 'crates/oxide-ui/Cargo.lock') }}

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/oxide-ui


            # `/var/cache/apt/archives` is root-owned, so an `actions/cache` of that
      # path never saved (tar failed on `partial`/`lock`). Point apt at a
      # runner-owned cache instead: the ~300 MB of .debs is what a slow mirror
      # makes expensive, and the same install has taken 0.4 and 21 minutes.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-gtk-vulkan-1

      - name: Linux native libraries (GTK 4, Vulkan, Xvfb, screenshot)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # A stalled mirror read once parked this step for half an hour: fail
          # or retry instead of waiting on a dead connection.
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=5 update
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=5 install -y --no-install-recommends \
            libgtk-4-dev libjavascriptcoregtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpango1.0-dev libvulkan1 mesa-vulkan-drivers xvfb imagemagick \
            fonts-noto-cjk

      - name: Install nsh (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: nsh version
        shell: bash
        run: nsh --version

      - name: Build the desktop package
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/desktop-package.sh dist

      - name: Software-rendering evidence (four levels + orthographic)
        shell: bash
        run: ./scripts/render-evidence.sh artifacts/render

      - name: Run the packaged app and screenshot (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The inner script is single-quoted on purpose: $! and $pid belong to it.
          # shellcheck disable=SC2016
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            set -euo pipefail
            OXIDE_DEMO=1 dist/linux/oxide-fab/oxidefab &
            pid=$!
            sleep 20
            import -window root artifacts/desktop-linux.png
            kill $pid || true
          '
          test -s artifacts/desktop-linux.png

      - name: Run the packaged app and screenshot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          OXIDE_DEMO=1 "dist/macos/oxide-fab.app/Contents/MacOS/oxidefab" &
          pid=$!
          sleep 20
          swift scripts/window-shot.swift oxide-fab artifacts/desktop-macos.png
          kill $pid || true
          test -s artifacts/desktop-macos.png

      - name: Run the packaged app and screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OXIDE_DEMO = "1"
          # The runner's desktop is smaller than the app's 1500x940 window, and a
          # window larger than the desktop captures with blank strips. Ask for a
          # 1600x1000 virtual display where the cmdlet exists; the capture below
          # falls back to the window's minimum size when it does not.
          try {
            Set-DisplayResolution -Width 1600 -Height 1000 -ErrorAction Stop
            Start-Sleep -Seconds 2
          } catch {
            Write-Host "Set-DisplayResolution unavailable: $($_.Exception.Message)"
          }
          # nsh names the Windows binary after --name (oxide-fab.exe); on macOS
          # and Linux it is oxidefab.
          $exe = Get-Item "dist\windows\oxide-fab\oxide-fab.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "no oxide-fab.exe in the Windows package" }
          Write-Host "package contents:"
          Get-ChildItem "dist\windows\oxide-fab" | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "starting $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'oxide' } |
              Select-Object -First 3 | Format-List TimeCreated, Id, LevelDisplayName, Message
            throw "the packaged app exited with code $($app.ExitCode)"
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class OxideWin {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr hWnd, int x, int y, int width, int height, bool repaint);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hWnd, int attribute, out RECT rect, int size);
          }
          "@
          $proc = Get-Process oxide-fab | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          if (-not $proc) { throw "the packaged app has no window" }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          if ($screen.Width -ge 1500 -and $screen.Height -ge 940) {
            $width = 1500; $height = 940
          } else {
            # The minimum the app itself declares; the layout is narrower there.
            $width = 1120; $height = 720
          }
          Write-Host "desktop $($screen.Width)x$($screen.Height); window ${width}x${height}"
          [OxideWin]::MoveWindow($proc.MainWindowHandle, 0, 0, $width, $height, $true) | Out-Null
          [OxideWin]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 3
          $rect = New-Object OxideWin+RECT
          # GetWindowRect includes the invisible DWM resize border, which
          # CopyFromScreen would capture as a blank margin.
          if ([OxideWin]::DwmGetWindowAttribute($proc.MainWindowHandle, 9, [ref]$rect, 16) -ne 0) {
            [OxideWin]::GetWindowRect($proc.MainWindowHandle, [ref]$rect) | Out-Null
          }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          Write-Host "capturing ${width}x${height} at $($rect.Left),$($rect.Top)"
          $bitmap = New-Object System.Drawing.Bitmap($width, $height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
          $bitmap.Save("artifacts\desktop-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $app.Id -Force

      - name: Archive the package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' crates/oxide-ui/nsh.json | head -1)"
          arch="$(uname -m)"
          if [ "${{ matrix.target }}" = "macos" ]; then
            ditto -c -k --keepParent "dist/macos/oxide-fab.app" \
              "dist/oxide-fab-${version}-macos-${arch}.zip"
          else
            tar -C dist/linux -czf \
              "dist/oxide-fab-${version}-linux-${arch}.tar.gz" oxide-fab
          fi

      - name: Archive the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/oxide-ui/nsh.json -Pattern '"version":\s*"([^"]+)"').Matches.Groups[1].Value
          Compress-Archive -Path "dist\windows\oxide-fab" `
            -DestinationPath "dist\oxide-fab-$version-windows-x86_64.zip"
          $setup = Get-ChildItem -Path "dist\windows" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "dist\oxide-fab-$version-windows-x86_64-setup.exe"
            Write-Host "Inno Setup installer: $($setup.Name)"
          } else {
            Write-Host "::warning::Inno Setup 6 is not installed: the Windows package is the zip only"
          }

      - name: Upload the desktop evidence
        if: always() && inputs.artifacts != false
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            artifacts/desktop-${{ matrix.target }}.png
            artifacts/render/**
            dist/oxide-fab-*.zip
            dist/oxide-fab-*.tar.gz
            dist/oxide-fab-*.exe
          if-no-files-found: warn

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Lint both workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color \
            .github/workflows/ci.yml .github/workflows/release.yml

  integration:
    name: docker compose, smoke, chaos
    # The stack is built from source in Docker; it does not use the UI workspace.
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Demo credentials (not production)
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --wait

      - name: Migrations (idempotent, safe to rerun)
        run: docker compose exec -T oxide /oxide --migrate-only

      - name: "Smoke: six lots, four steps, complete genealogy"
        run: ./scripts/smoke.sh

      - name: "Idempotency: the same event_id adds no point"
        run: ./scripts/idempotency.sh

      - name: "Replay: truncate GreptimeDB and rebuild it from PostgreSQL"
        run: ./scripts/replay.sh

      - name: "Backup: pgBackRest + logical dumps + Greptime snapshot"
        run: ./scripts/backup.sh

      - name: Restore drill in an isolated project
        run: ./scripts/restore.sh

      - name: "Chaos: store down, database down, restore drill"
        run: ./scripts/chaos.sh

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload the chaos report and restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oxide-evidence
          path: |
            artifacts/chaos-report.md
            artifacts/restore-latest.json
            artifacts/backup-latest.json
            artifacts/*.log
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: docker compose down -v
