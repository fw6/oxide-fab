# oxide-fab: one compose file for the whole demo line.
#
#   postgres   — the single source of truth, with pgBackRest WAL archiving
#   rustfs     — S3-compatible object store for GreptimeDB data and backups
#   greptimedb — the derived time series store, its data on the object store
#   oxide      — simulator, outbox projector, SECS/GEM pair and HTTP API
#
# Credentials come from .env (see .env.example); they are demo values.
#
# The object store is RustFS rather than MinIO because MinIO's public images
# and binaries are no longer distributable (see
# docs/decisions/004-object-store.md). The S3 API, the bucket names
# (oxide-data, oxide-backup) and every client are unchanged.

name: oxide-fab

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oxide}
      POSTGRES_USER: ${POSTGRES_USER:-oxide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
      # pgBackRest reads these as configuration.
      PGBACKREST_STANZA: oxide
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_PORT: 5432
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-oxide}
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-oxide}
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_S3_BUCKET: ${S3_BACKUP_BUCKET:-oxide-backup}
      PGBACKREST_REPO1_S3_ENDPOINT: http://rustfs:9000
      PGBACKREST_REPO1_S3_REGION: us-east-1
      PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY_ID:?copy .env.example to .env first}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env first}
      PGBACKREST_REPO1_S3_URI_STYLE: path
      PGBACKREST_REPO1_RETENTION_FULL: 2
      PGBACKREST_COMPRESS_TYPE: lz4
      PGBACKREST_START_FAST: "y"
    command:
      - postgres
      - -c
      - "wal_level=replica"
      - -c
      - "archive_mode=on"
      - -c
      - "archive_timeout=300"
      - -c
      - "max_wal_senders=3"
      - -c
      - "archive_command=pgbackrest --stanza=oxide archive-push %p"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxide} -d ${POSTGRES_DB:-oxide}"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      rustfs:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully

  rustfs:
    image: rustfs/rustfs:v1.0.6
    restart: unless-stopped
    command: server /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?copy .env.example to .env first}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env first}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  bucket-init:
    image: amazon/aws-cli:2.40.3
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?copy .env.example to .env first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env first}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        endpoint="http://rustfs:9000"
        for bucket in "${S3_DATA_BUCKET:-oxide-data}" "${S3_BACKUP_BUCKET:-oxide-backup}"; do
          aws --endpoint-url "$$endpoint" s3 mb "s3://$$bucket" 2>/dev/null || true
          aws --endpoint-url "$$endpoint" s3 ls "s3://$$bucket" >/dev/null
        done
        echo "buckets ready"
    volumes:
      # Used by `scripts/backup.sh` to upload the logical dumps.
      - ./artifacts:/artifacts

  greptimedb:
    image: greptime/greptimedb:v1.3.1
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    environment:
      GREPTIMEDB_STANDALONE__STORAGE__TYPE: S3
      GREPTIMEDB_STANDALONE__STORAGE__BUCKET: ${S3_DATA_BUCKET:-oxide-data}
      GREPTIMEDB_STANDALONE__STORAGE__ROOT: /oxide
      GREPTIMEDB_STANDALONE__STORAGE__ENDPOINT: http://rustfs:9000
      GREPTIMEDB_STANDALONE__STORAGE__REGION: us-east-1
      GREPTIMEDB_STANDALONE__STORAGE__ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?copy .env.example to .env first}
      GREPTIMEDB_STANDALONE__STORAGE__SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env first}
      GREPTIMEDB_STANDALONE__STORAGE__ENABLE_VIRTUAL_HOST_STYLE: "false"
    command:
      - standalone
      - start
      - --http-addr
      - 0.0.0.0:4000
      - --grpc-bind-addr
      - 0.0.0.0:4001
      - --mysql-addr
      - 0.0.0.0:4002
      - --postgres-addr
      - 0.0.0.0:4003
      - --data-home
      - /var/lib/greptime
    volumes:
      - greptimedata:/var/lib/greptime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  oxide:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      greptimedb:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-oxide}:${POSTGRES_PASSWORD:?copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-oxide}
      GREPTIME_URL: http://greptimedb:4000
      GREPTIME_DB: public
      OXIDE_HTTP_ADDR: 0.0.0.0:8080
      SCENARIO_PATH: /app/config/scenario.json
      SECS_BIND: 127.0.0.1:50010
      RUST_LOG: ${RUST_LOG:-info,oxide=debug}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  objectdata:
  greptimedata:
